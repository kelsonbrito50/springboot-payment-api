services:
  postgres:
    image: postgres:16-alpine
    container_name: payments-db
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      # Read from .env (copy .env.example); compose refuses to start without it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - payments-data:/var/lib/postgresql/data
    healthcheck:
      # The app waits for this before Flyway runs, so an empty database never
      # looks like a connection failure.
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  payments-data:
