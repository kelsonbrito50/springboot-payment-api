spring.application.name=springboot-payment-api

# Matches the service defined in compose.yaml. Override with SPRING_DATASOURCE_*
# environment variables in any real deployment.
spring.datasource.url=jdbc:postgresql://localhost:5432/payments
spring.datasource.username=payments
spring.datasource.password=payments

# Flyway owns the schema, so Hibernate must never modify it. Validating on
# startup means a drifted entity fails fast instead of at the first query.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Surfaces N+1 queries during development instead of hiding them.
spring.jpa.open-in-view=false
