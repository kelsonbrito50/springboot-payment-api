spring.application.name=springboot-payment-api

# Local settings come from .env (copy .env.example); the file is git-ignored.
# Override with SPRING_DATASOURCE_* environment variables in any real deployment.
spring.config.import=optional:file:.env[.properties]

# Matches the service defined in compose.yaml.
spring.datasource.url=jdbc:postgresql://localhost:5432/payments
spring.datasource.username=payments
spring.datasource.password=${POSTGRES_PASSWORD:}

# Flyway owns the schema, so Hibernate must never modify it. Validating on
# startup means a drifted entity fails fast instead of at the first query.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Surfaces N+1 queries during development instead of hiding them.
spring.jpa.open-in-view=false
